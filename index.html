<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Akshay Hire — Director of Platform Engineering</title>
  <meta name="description" content="Portfolio and resume of Akshay Hire — Director of Platform Engineering, Cloud Architect, API Strategist and Gen AI Platform Designer.">
  <meta name="keywords" content="Akshay Hire, Platform Engineering, Cloud Architect, DevOps, Kubernetes, AWS, GCP, Gen AI, API Strategy, Wise">
  <meta name="author" content="Akshay Hire">
  <meta property="og:title" content="Akshay Hire — Platform Engineering & Cloud Architecture">
  <meta property="og:description" content="Head of Solution Engineering APAC. Building platforms that move money globally.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://akshayh.github.io">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
  <link href="styles.css" rel="stylesheet">
</head>
<body>

  <nav id="site-nav" class="site-nav"></nav>

  <header id="hero" class="hero"></header>

  <main>
    <section id="about">
      <div id="about-content" class="container"></div>
    </section>

    <section id="skills">
      <div id="skills-content" class="container"></div>
    </section>

    <section id="experience">
      <div id="experience-content" class="container"></div>
    </section>

    <section id="certifications">
      <div id="certs-content" class="container"></div>
    </section>

    <section id="expertise">
      <div id="expertise-content" class="container"></div>
    </section>

    <section id="contact">
      <div id="contact-content" class="container"></div>
    </section>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <div id="nudge-modal" class="nudge-modal" aria-modal="true" role="dialog">
    <div class="nudge-modal-card">
      <h3>Notify Me</h3>
      <p>Leave your details and I'll get a WhatsApp notification automatically.</p>
      <form id="nudge-form">
        <input id="nudge-name" type="text" name="name" placeholder="Your name" autocomplete="name">
        <input id="nudge-phone" type="tel" name="phone" placeholder="WhatsApp number, e.g. +65 9123 4567" required autocomplete="tel">
        <textarea id="nudge-message" name="message" rows="3" placeholder="What would you like to discuss? (optional)"></textarea>
        <div class="nudge-modal-actions">
          <button type="button" class="btn btn-ghost nudge-cancel">Cancel</button>
          <button type="submit" class="btn btn-primary">Notify Me</button>
        </div>
        <div id="nudge-status" class="nudge-status"></div>
      </form>
    </div>
  </div>

  <script src="content.js"></script>
  <script src="app.js"></script>
</body>
</html>
